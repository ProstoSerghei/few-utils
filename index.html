<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Расчёт множителей</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
    .copy-cell {
        display: inline-flex;
        align-items: center;
        gap: .5rem;
    }

    .copy-btn {
        padding: .125rem .375rem;
        line-height: 1;
    }
</style>
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="card shadow-sm">
        <div class="card-body">

            <h1 class="h4 mb-4">Расчёт множителей</h1>

            <div id="rows"></div>

            <div class="d-flex gap-2 mb-4">
                <button class="btn btn-outline-primary" onclick="addRow()">
                    Добавить строку
                </button>

                <button class="btn btn-outline-danger" onclick="removeRow()">
                    Удалить строку
                </button>
            </div>

            <button class="btn btn-primary" onclick="calculate()">
                Рассчитать
            </button>

            <div id="result" class="mt-4"></div>

        </div>
    </div>
</div>

<script>
const COPY_ICON = `
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-copy" viewBox="0 0 16 16" aria-hidden="true">
        <path fill-rule="evenodd" d="M4 2a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2zm2-1a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1zM2 5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1v-1h1v1a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h1v1z"/>
    </svg>
`;

function parseNumbersAverage(text) {
    const normalized = text
        .replace(/,/g, '.')
        .replace(/[–—]/g, '-');

    const matches = normalized.match(/\d+(?:\.\d+)?/g);

    if (!matches || matches.length === 0) {
        return '';
    }

    const numbers = matches.map(Number);
    const sum = numbers.reduce((acc, n) => acc + n, 0);

    return sum / numbers.length;
}

function normalizeTradeNote(note) {
    return String(note)
        .replace(/\(\s*\d+(?:[.,]\d+)?\s*[–—-]\s*\d+(?:[.,]\d+)?\s*\)/g, '#')
        .replace(/\d+(?:[.,]\d+)?\s*[–—-]\s*\d+(?:[.,]\d+)?/g, '#')
        .replace(/\d+(?:[.,]\d+)?/g, '#');
}

function formatNumber(value, precision = 3) {
    if (!Number.isFinite(value)) {
        return '';
    }

    return String(Number(value.toFixed(precision)));
}

function escapeHtml(value) {
    return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
}

function addRow(note = '', value = '', desiredValue = 10) {
    const rows = document.getElementById('rows');

    const div = document.createElement('div');
    div.className = 'row g-2 mb-2 calc-row';

    div.innerHTML = `
        <div class="col-md-6">
            <input
                type="text"
                class="form-control note"
                placeholder="Примечание"
                value="${escapeHtml(note)}"
            >
        </div>

        <div class="col-md-3">
            <input
                type="number"
                step="any"
                class="form-control value"
                placeholder="Значение"
                value="${escapeHtml(value)}"
            >
        </div>

        <div class="col-md-3">
            <input
                type="number"
                step="any"
                class="form-control desired-value"
                placeholder="Желаемое значение"
                value="${escapeHtml(desiredValue)}"
            >
        </div>
    `;

    const noteInput = div.querySelector('.note');
    const valueInput = div.querySelector('.value');

    noteInput.addEventListener('input', () => {
        const parsedValue = parseNumbersAverage(noteInput.value);

        if (parsedValue !== '') {
            valueInput.value = formatNumber(parsedValue);
        }
    });

    rows.appendChild(div);
}

function removeRow() {
    const rows = document.querySelectorAll('.calc-row');
    if (rows.length > 1) {
        rows[rows.length - 1].remove();
    }
}

async function copyText(text) {
    try {
        await navigator.clipboard.writeText(text);
    } catch (error) {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.setAttribute('readonly', '');
        textarea.style.position = 'absolute';
        textarea.style.left = '-9999px';
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        textarea.remove();
    }
}

function createCopyCell(value) {
    const safeValue = escapeHtml(value);

    return `
        <span class="copy-cell">
            <span>${safeValue}</span>
            <button
                type="button"
                class="btn btn-sm btn-outline-secondary copy-btn"
                title="Копировать"
                aria-label="Копировать"
                data-copy="${safeValue}"
            >
                ${COPY_ICON}
            </button>
        </span>
    `;
}

function bindCopyButtons() {
    document.querySelectorAll('[data-copy]').forEach(button => {
        button.addEventListener('click', () => copyText(button.dataset.copy));
    });
}

function calculate() {
    const rows = document.querySelectorAll('.calc-row');

    let html = `
        <table class="table table-bordered table-striped align-middle">
            <thead>
                <tr>
                    <th>Примечание</th>
                    <th>Значение</th>
                    <th>Желаемое значение</th>
                    <th>Множитель</th>
                    <th>Результат</th>
                </tr>
            </thead>
            <tbody>
    `;

    rows.forEach(row => {
        const rawNote = row.querySelector('.note').value || '-';
        const note = normalizeTradeNote(rawNote);
        const value = parseFloat(row.querySelector('.value').value);
        const desiredValue = parseFloat(row.querySelector('.desired-value').value);

        if (isNaN(value) || value === 0 || isNaN(desiredValue)) return;

        const multiplier = desiredValue / value;
        const result = value * multiplier;

        html += `
            <tr>
                <td>${createCopyCell(note)}</td>
                <td>${createCopyCell(formatNumber(value))}</td>
                <td>${createCopyCell(formatNumber(desiredValue))}</td>
                <td>${createCopyCell(formatNumber(multiplier))}</td>
                <td>${createCopyCell(formatNumber(result))}</td>
            </tr>
        `;
    });

    html += '</tbody></table>';
    document.getElementById('result').innerHTML = html;
    bindCopyButtons();
}

addRow('');
addRow('');
addRow('');
</script>

</body>
</html>
